<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="calculator">            
            <div class="buttonRow0">
                <button id="clearBtn">C</button>
                <div class="mainDisplay"></div>
            </div>
            

            <div class="buttonRow1">        
                <button id="Btn7">7</button>
                <button id="Btn8">8</button>
                <button id="Btn9">9</button>
                <button id="divideBtn">÷</button>
            </div>

            <div class="buttonRow2">
                <button id="Btn4">4</button>
                <button id="Btn5">5</button>
                <button id="Btn6">6</button>
                <button id="multiplyBtn">x</button>

            </div>

            <div class="buttonRow3">
                <button id="Btn1">1</button>
                <button id="Btn2">2</button>
                <button id="Btn3">3</button>
                <button id="subBtn">-</button>
            </div>

            <div class="buttonRow4">
                <button id="Btn0">0</button>
                <button id="decimalBtn">.</button>
                <button id="equalBtn">=</button>
                <button id="addBtn">+</button>
            </div>
            

        </div>
            <script src="script.js" defer></script>
    </body>
</html>
