<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="mainDisplay">Display Here!</div>

        <button id="clearBtn">C</button>

        <div class="buttonRow1">        
            <button id="7Btn">7</button>
            <button id="8Btn">8</button>
            <button id="9Btn">9</button>
            <button id="divideBtn">÷</button>
        </div>

        <div class="buttonRow2">
            <button id="4Btn">4</button>
            <button id="5Btn">5</button>
            <button id="6Btn">6</button>
            <button id="multiplyBtn">x</button>

        </div>

        <div class="buttonRow3">
            <button id="1Btn">1</button>
            <button id="2Btn">2</button>
            <button id="3Btn">3</button>
            <button id="subBtn">-</button>
        </div>

        <div class="buttonRow4">
            <button id="1Btn">0</button>
            <button id="2Btn">.</button>
            <button id="equalBtn">=</button>
            <button id="addBtn">+</button>
        </div>
        

        
        <script src="script.js" defer></script>
    </body>
</html>
